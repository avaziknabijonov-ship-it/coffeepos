name: CoffeePOS checks

on:
  pull_request:
    branches: [coffeepos-development]
  push:
    branches: [coffeepos-development]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run backend tests from isolated checkout
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

  postgres_backup_restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coffeepos
          POSTGRES_USER: coffeepos
          POSTGRES_PASSWORD: coffeepos-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coffeepos -d coffeepos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test backend into isolated runner
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Seed isolated PostgreSQL test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://coffeepos:coffeepos-ci-test-only@127.0.0.1:5432/coffeepos
          SEED_DEMO: '0'
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from sqlalchemy import select
          from app.main import init_db, create_company
          from app.db import SessionLocal, Company
          init_db()
          with SessionLocal() as db:
              create_company(db, "backup-pilot", "Backup Pilot", "Test Owner", "9988")
              db.commit()
              assert db.scalar(select(Company).where(Company.slug == "backup-pilot"))
          PY
      - name: Back up and restore into separate CI database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U coffeepos --format=custom -f /tmp/coffeepos-ci.dump coffeepos
          docker exec "$PG_CONTAINER" createdb -U coffeepos coffeepos_restored
          docker exec "$PG_CONTAINER" pg_restore -U coffeepos -d coffeepos_restored /tmp/coffeepos-ci.dump
      - name: Verify restored cafe and subscription data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://coffeepos:coffeepos-ci-test-only@127.0.0.1:5432/coffeepos_restored
          SEED_DEMO: '0'
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from sqlalchemy import select
          from app.db import SessionLocal, Company, Subscription, Staff, Product
          with SessionLocal() as db:
              company = db.scalar(select(Company).where(Company.slug == "backup-pilot"))
              assert company is not None and company.name == "Backup Pilot"
              sub = db.scalar(select(Subscription).where(Subscription.company_id == company.id))
              assert sub is not None and sub.status == "trial"
              assert db.scalar(select(Staff).where(Staff.company_id == company.id))
              assert db.scalar(select(Product).where(Product.company_id == company.id))
          print("PostgreSQL isolated backup and restore: OK")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies from locked versions
        run: npm ci --no-audit --no-fund
      - name: Validate platform license admin UI JavaScript
        run: node scripts/check-platform-admin.mjs
      - name: Typecheck and build web bundle
        run: npm run build
      - name: Frontend lint
        run: npm run lint

  android_debug:
    runs-on: ubuntu-latest
    needs: frontend
    env:
      # Install side-by-side with existing CoffeePOS; never replace the cafe app.
      COFFEEPOS_TEST_APK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Android build dependencies
        run: npm ci --no-audit --no-fund
      - name: Create Android project and sync bundled frontend
        run: |
          npx cap add android
          npm run android:sync
      - name: Verify test APK identity cannot replace cafe installation
        run: |
          grep -q "uz.coffeepos.hybrid.test" android/app/build.gradle
          grep -q "CoffeePOS TEST" android/app/src/main/res/values/strings.xml
      - name: Build unsigned debug APK (test use only)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Publish test APK for manual device verification
        uses: actions/upload-artifact@v4
        with:
          name: coffeepos-test-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
