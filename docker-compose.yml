services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffeepos
      POSTGRES_USER: coffeepos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeepos"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://coffeepos:${POSTGRES_PASSWORD}@db:5432/coffeepos
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SEED_DEMO: ${SEED_DEMO:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: [api]

volumes:
  pgdata:
