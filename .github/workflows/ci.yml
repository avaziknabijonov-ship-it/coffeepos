name: CoffeePOS checks

on:
  pull_request:
    branches: [coffeepos-development]
  push:
    branches: [coffeepos-development]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run backend tests from isolated checkout
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The existing package-lock is older than package.json's Capacitor deps.
      # npm install resolves those additions; sync the lockfile before switching to npm ci.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build web bundle
        run: npm run build
      - name: Frontend lint
        run: npm run lint

  android_debug:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project and sync bundled frontend
        run: |
          npx cap add android
          npm run android:sync
      - name: Build unsigned debug APK (test use only)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Publish test APK for manual device verification
        uses: actions/upload-artifact@v4
        with:
          name: coffeepos-test-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
