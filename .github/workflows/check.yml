name: CoffeePOS checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coffeepos_ci_test
          POSTGRES_USER: coffeepos_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeepos_test -d coffeepos_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
          COFFEEPOS_TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://coffeepos_test:disposable-ci-password@127.0.0.1:5432/coffeepos_ci_test' || '' }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-i18n.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run build
