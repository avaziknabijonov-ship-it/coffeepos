name: Android APK (online CoffeePOS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.ts'
      - 'index.html'
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK on GitHub runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:-/opt/android-sdk}" || { echo "Android SDK not available"; exit 1; }
          java -version
      - run: npm ci
      - name: Verify TypeScript and build Android web assets
        run: npm run build
      - name: Install Capacitor tools
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build test APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CoffeePOS-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
