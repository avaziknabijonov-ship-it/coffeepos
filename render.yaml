# TEST ONLY. Free PostgreSQL expires after 30 days; no managed backups.
databases:
  - name: coffeepos-test-db
    plan: free
    databaseName: coffeepos
    user: coffeepos

services:
  - type: web
    name: coffeepos-test-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffeepos-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "0"
      - key: CORS_ORIGINS
        value: "https://localhost"
      - key: PLATFORM_ADMIN_KEY
        generateValue: true
